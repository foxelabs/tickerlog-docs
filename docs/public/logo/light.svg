<svg width="184.69" height="32.0" viewBox="0 0 184.69 32.0" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TickerLog Docs">
  <title>TickerLog Docs</title>
  <desc>
    The TickerLog mark, wordmark and Docs badge — the docs navbar lockup.

    The mark is public/favicon.svg itself, nested as an inline svg rather than
    redrawn: the same artwork the app, the marketing site and the admin panel
    render, and the same file this repo serves as its own favicon. It carries
    its own tile, radius and petrol, so there is no light and dark variant of the
    mark any more; the two files differ only in the wordmark and badge colours.

    The wordmark is Figtree 900 at 20px with -0.02em tracking, converted to
    outlines rather than set as text. An SVG loaded as an image is an isolated
    document that cannot resolve a webfont, so a text element here would render
    in whatever the system serves and would not be Figtree. The badge is
    Figtree 600 at 12px and is unchanged.

    Because these are outlines, editing the words or the weight means
    regenerating the paths, not editing this file.

    Colours are literals for the same reason: an image cannot read a stylesheet.

    NOTE: this is a desc element rather than an XML comment on purpose. A
    comment cannot contain a double hyphen, and naming CSS custom properties
    inside one makes the file invalid XML. The browser then declines to decode
    it and the logo renders at zero width with nothing in the console.
  </desc>
